aid: mindlogic
name: Mindlogic
description: >-
  Mindlogic is a South Korean generative-AI company whose products include
  FactChat (a multi-LLM enterprise chat platform with Studio chatbot building,
  deep research, meeting notes, and image/video generation), Bliss (a persona
  chatbot that learns a person's voice and personality for fan engagement), and
  Informe (a multilingual document-grounded website chatbot). For developers,
  Mindlogic operates the FactChat API Gateway — a unified, OpenAI- and
  Anthropic-compatible LLM proxy that fronts models from OpenAI, Anthropic,
  Google Gemini, xAI and Perplexity behind a single API key, metered in credits,
  with chat completions, an OpenAI Responses pass-through, an Anthropic Messages
  pass-through, text-to-speech, and image/video generation.
